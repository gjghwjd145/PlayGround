<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101a2d" />
  <meta name="description" content="Raise, craft, and adventure with your own little slimes." />
  <title>Slimebound — A tiny slime RPG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"}}
  </script>
  <script type="module" src="game.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Slimebound home"><span class="brand-mark">✦</span><span>slime<span class="brand-light">bound</span></span></a>
      <div class="season-pill"><span class="season-dot"></span> VERDANT SEASON <span class="season-divider">·</span> DAY <b id="day-count">01</b></div>
      <div class="resources">
        <div class="resource"><span class="resource-icon coin-icon">✦</span><b id="coin-count">120</b><span class="resource-name">GLOW</span></div>
        <div class="resource"><span class="resource-icon dew-icon">◈</span><b id="dew-count">8</b><span class="resource-name">DEW</span></div>
        <button class="avatar-button" id="profile-button" aria-label="Player profile">A</button>
      </div>
    </header>
    <div class="layout">
      <aside class="sidebar" aria-label="Main navigation">
        <div class="side-label">YOUR WORLD</div>
        <button class="nav-item active" data-view="home"><span class="nav-icon">⌂</span><span>HABITAT</span><i></i></button>
        <button class="nav-item" data-view="lab"><span class="nav-icon">✧</span><span>SLIME LAB</span><i></i></button>
        <button class="nav-item" data-view="explore"><span class="nav-icon">⚔</span><span>EXPLORE</span><i></i></button>
        <button class="nav-item" data-view="collection"><span class="nav-icon">▦</span><span>COLLECTION</span><i></i></button>
        <div class="side-spacer"></div>
        <div class="side-quest"><div class="quest-spark">✦</div><div class="quest-caption">TODAY'S TASK</div><b id="quest-title">Give your slime a treat</b><div class="quest-progress"><span id="quest-progress"></span></div><div class="quest-foot"><span id="quest-progress-label">0 / 1</span><span>+15 ✦</span></div></div>
        <div class="sidebar-foot"><span class="online-dot"></span> YOUR LITTLE WORLD IS SAFE</div>
      </aside>
      <main id="main-content" class="main-content" aria-live="polite"></main>
    </div>
    <nav class="mobile-nav" aria-label="Mobile navigation">
      <button class="mobile-nav-item active" data-view="home"><span>⌂</span><small>HOME</small></button>
      <button class="mobile-nav-item" data-view="lab"><span>✧</span><small>MAKE</small></button>
      <button class="mobile-nav-item" data-view="explore"><span>⚔</span><small>GO</small></button>
      <button class="mobile-nav-item" data-view="collection"><span>▦</span><small>SLIMES</small></button>
    </nav>
    <div id="toast" class="toast" role="status"></div>
    <div id="modal-root"></div>
  </div>
</body>
</html>
